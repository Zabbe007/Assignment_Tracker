<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&display=swap" rel="stylesheet">
</head>
<body>
 
  <!-- =====================================================
       HEADER
       ===================================================== -->
  <header>
    <h1 class="header-title">ASSIGNMENT TRACKER
      <a href="#" class="icon"> &#x2295;</a>
    </h1>
    <p>Keep track of your coursework and deadlines.</p>
  </header>
 
  <!-- =====================================================
       DASHBOARD STATS
       Shows a live count of assignments by status.
       Numbers are updated by JavaScript in app.js.
       ===================================================== -->
  <section class="dashboard">
    <div class="stat-box">
      <span class="stat-number" id="count-total">0</span>
      <span class="stat-label">Total</span>
    </div>
    <div class="stat-box">
      <span class="stat-number" id="count-inprogress">0</span>
      <span class="stat-label">In Progress</span>
    </div>
    <div class="stat-box">
      <span class="stat-number" id="count-completed">0</span>
      <span class="stat-label">Completed</span>
    </div>
    <div class="stat-box">
      <span class="stat-number red" id="count-overdue">0</span>
      <span class="stat-label">Overdue</span>
    </div>
  </section>
 
  <!-- =====================================================
       ADD ASSIGNMENT FORM
       User fills this in to create a new assignment.
       The "onsubmit" calls addAssignment() in app.js.
       ===================================================== -->
  <section class="form-section">
    <h2>Add New Assignment</h2>
 
    <form id="assignment-form" onsubmit="addAssignment(event)">
 
      <div class="form-row">
        <label for="input-title">Assignment Title *</label>
        <input type="text" id="input-title" placeholder="e.g. Chapter 5 Essay" required />
      </div>
 
      <div class="form-row">
        <label for="input-course">Course *</label>
        <input type="text" id="input-course" placeholder="e.g. Software Engineering" required />
      </div>
 
      <div class="form-row">
        <label for="input-desc">Description</label>
        <textarea id="input-desc" placeholder="Optional notes about the assignment..."></textarea>
      </div>
 
      <div class="form-row">
        <label for="input-due">Due Date *</label>
        <input type="date" id="input-due" required />
      </div>
 
      <div class="form-row">
        <label for="input-priority">Priority *</label>
        <select id="input-priority">
          <option value="High">High</option>
          <option value="Medium" selected>Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>
 
      <button type="submit" class="btn-primary">Add Assignment</button>
 
    </form>
  </section>
 
  <!-- =====================================================
       FILTER & SORT CONTROLS
       Buttons let the user filter which assignments show.
       <select> lets them sort the list.
       ===================================================== -->
  <section class="controls-section">
    <div class="filter-buttons">
      <button class="filter-btn active" onclick="setFilter('All')">All</button>
      <button class="filter-btn" onclick="setFilter('In Progress')">In Progress</button>
      <button class="filter-btn" onclick="setFilter('Completed')">Completed</button>
    </div>
 
    <div class="sort-control">
      <label for="sort-select">Sort by:</label>
      <select id="sort-select" onchange="renderList()">
        <option value="due">Due Date</option>
        <option value="priority">Priority</option>
        <option value="course">Course</option>
      </select>
    </div>
  </section>
 
  <!-- =====================================================
       ASSIGNMENT LIST
       This div is empty on page load.
       JavaScript (renderList in app.js) fills it in.
       ===================================================== -->
  <section class="list-section">
    <h2>Your Assignments</h2>
    <div id="assignment-list">
      <!-- Assignment cards are inserted here by JavaScript -->
    </div>
  </section>
 
  <!-- =====================================================
       EDIT MODAL
       Hidden by default. Shows when the user clicks Edit
       on an assignment card. Controlled by app.js.
       ===================================================== -->
  <div id="edit-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h2>Edit Assignment</h2>
 
      <!-- Hidden field stores which assignment we are editing -->
      <input type="hidden" id="edit-id" />
 
      <div class="form-row">
        <label for="edit-title">Title *</label>
        <input type="text" id="edit-title" required />
      </div>
 
      <div class="form-row">
        <label for="edit-course">Course *</label>
        <input type="text" id="edit-course" required />
      </div>
 
      <div class="form-row">
        <label for="edit-desc">Description</label>
        <textarea id="edit-desc"></textarea>
      </div>
 
      <div class="form-row">
        <label for="edit-due">Due Date *</label>
        <input type="date" id="edit-due" required />
      </div>
 
      <div class="form-row">
        <label for="edit-priority">Priority</label>
        <select id="edit-priority">
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>
 
      <div class="modal-buttons">
        <button class="btn-primary" onclick="saveEdit()">Save Changes</button>
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      </div>
 
    </div>
  </div>
 
  <script src="app.js"></script>
 
</body>
</html>
